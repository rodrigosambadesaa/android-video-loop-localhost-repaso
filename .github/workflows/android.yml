name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --channel=3 "platforms;android-CinnamonBun" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-CinnamonBun" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
